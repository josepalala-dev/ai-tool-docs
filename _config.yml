# GitHub Pages serves this repository root. No theme gem, no build step, no npm: push
# markdown and the site updates itself — the docs are the site.
#
# This repo is consumed as the `docs/` submodule of josepalala-dev/ai-sdlc-tool, which is
# private. Publishing the submodule rather than the parent is what lets the documentation and
# the task matrix be public while the code stays private.
title: ai-sdlc-tool
description: A cheap, stack-agnostic software lifecycle for working with coding agents. Documents, not vibes.
url: https://josepalala-dev.github.io
baseurl: /ai-tool-docs
repository: josepalala-dev/ai-tool-docs
github_repo: https://github.com/josepalala-dev/ai-tool-docs

# Every page gets the layout without needing front matter, so the dogfooded docs under
# docs/arch-docs/ and friends render styled without being edited.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Working state, not site content.
exclude:
  - README.md
  - arch-docs
  - dev-tasks
  - testing-plan
  - validation

kramdown:
  input: GFM
  syntax_highlighter: rouge
